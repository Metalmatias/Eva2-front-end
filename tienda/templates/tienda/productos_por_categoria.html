{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Productos en {{ categoria.nombre }}</title>
    <link rel="stylesheet" href="{% static 'css/categorias.css' %}">
</head>
<body>
    <h1>Productos en {{ categoria.nombre }}</h1>

    <div class="productos-grid">
        {% for producto in productos %}
            <div class="producto-card">
                <img src="{{ producto.imagen.url }}" alt="{{ producto.nombre }}">
                <h3>{{ producto.nombre }}</h3>
                <p class="precio">${{ producto.precio }}</p>
                <a href="{% url 'detalle_producto' producto.id %}" class="btn-detalle">Ver detalle</a>
            </div>
        {% empty %}
            <p>No hay productos en esta categoría.</p>
        {% endfor %}
    </div>

    <a href="{% url 'home' %}" class="volver">← Volver al inicio</a>
</body>
</html>
